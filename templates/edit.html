{% extends "base.html" %}

{% block title %}编辑文章 - {{ post.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4">
                    <i class="fas fa-edit me-2"></i>编辑文章
                </h2>

                <form action="{{ url_for('edit_post', post_id=post.id) }}" method="post">
                    <div class="mb-3">
                        <label for="edit_password" class="form-label">
                            <i class="fas fa-lock me-1"></i>操作密码
                        </label>
                        <input type="password" class="form-control" id="edit_password" name="edit_password" required>
                        <small class="form-text text-muted">请输入正确的操作密码才能编辑文章</small>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">
                            <i class="fas fa-heading me-1"></i>文章标题
                        </label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="tags" class="form-label">
                            <i class="fas fa-tags me-1"></i>标签
                        </label>
                        <input type="text" class="form-control" id="tags" name="tags" value="{{ post.tags }}">
                        <small class="form-text text-muted">多个标签请用逗号分隔</small>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">
                            <i class="fas fa-file-alt me-1"></i>文章内容
                        </label>
                        <textarea class="form-control" id="content" name="content" rows="15" required>{{ post.content }}</textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>保存更改
                        </button>
                        <a href="{{ url_for('show_post_by_id', post_id=post.id) }}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i>取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block action_buttons %}
<div class="action-buttons">
    <a href="{{ url_for('show_post_by_id', post_id=post.id) }}" class="btn btn-outline-primary btn-sm">
        <i class="fas fa-eye"></i> <span>查看文章</span>
    </a>
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-home"></i> <span>返回首页</span>
    </a>
</div>
{% endblock %}
