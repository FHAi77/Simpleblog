{% extends "base.html" %}

{% block title %}上传 Markdown 文章{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4">
                    <i class="fas fa-cloud-upload-alt me-2"></i>上传 Markdown 文章
                </h2>

                <form action="{{ url_for('upload_markdown') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="upload_password" class="form-label">
                            <i class="fas fa-lock me-1"></i>上传密码
                        </label>
                        <input type="password" class="form-control" id="upload_password" name="upload_password" required>
                        <small class="form-text text-muted">请输入正确的上传密码才能上传文章</small>
                    </div>
                    <div class="mb-3">
                        <label for="markdown_file" class="form-label">
                            <i class="fas fa-file-markdown me-1"></i>选择 Markdown 文件
                        </label>
                        <input class="form-control" type="file" id="markdown_file" name="markdown_file" accept=".md,.markdown" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-upload me-1"></i>上传文章
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i>取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block action_buttons %}
<div class="action-buttons">
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="fas fa-home"></i> <span>返回首页</span>
    </a>
</div>
{% endblock %}
